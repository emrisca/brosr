<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Brosr YouTube player fixture</title>
  <!-- The player module publishes window.__brosrYouTubePlayer. A module script
       runs before document_idle, so the bridge core sees it on start. -->
  <script type="module" src="/youtube-player.js"></script>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 24px; background: #111; color: #eee; }
    #movie_player {
      width: 640px;
      max-width: 100%;
      height: 200px;
      display: grid;
      place-items: center;
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
    }
    #movie_player.ad-showing { border-color: #d08a2f; }
    #movie_player.ad-showing::after { content: 'ad is playing'; color: #d08a2f; }
    button { font: inherit; padding: 6px 10px; margin: 8px 8px 0 0; }
    pre { font-family: monospace; background: #000; padding: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Brosr YouTube player fixture</h1>
  <p>
    The player below is a fake IFrame API object. It has no element fields, so
    the room reaches it through the adapter view in <code>core/youtube.mjs</code>.
    Load this page with the bridge installed to see the room numbers.
  </p>
  <div id="movie_player">fake IFrame player</div>
  <button id="play" type="button">Play</button>
  <button id="pause" type="button">Pause</button>
  <button id="seek" type="button">Seek to 20 min</button>
  <button id="ad" type="button">Toggle ad</button>
  <pre id="state">waiting for the player module</pre>
</body>
</html>
