[package]
name = "brosr-relay"
version = "0.1.0"
edition = "2021"
description = "Room relay for Brosr. Forwards text and binary frames without reading them."

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1"
