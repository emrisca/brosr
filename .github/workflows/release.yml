# A tag cuts a release. Each platform builds and signs its updater bundle. One
# final job writes latest.json from every platform, because three jobs writing
# that one asset race each other and the last one wins with only its own
# platform in it.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install the frontend
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Brosr v__VERSION__
          releaseBody: |
            Pick the installer for your platform. macOS uses the `.dmg`, Windows
            uses the `.msi` or the `.exe` setup.

            ## First launch on macOS

            This build carries an ad hoc signature and no notarisation, so macOS
            asks once. Move Brosr to Applications, try to open it, then allow it
            in System Settings, Privacy and Security, Open Anyway.

            ## First launch on Windows

            SmartScreen asks once. Choose More info, then Run anyway.

            ## Updates

            An installed app reads this release's `latest.json` on launch and
            again every six hours. Install downloads in place and restarts the
            app. The app checks each update against a signing key that ships
            inside it, and refuses a release signed with another key.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

  # The feed is one file for every platform, so one job owns it. It runs only
  # after every build succeeds, so a failed platform cannot publish a feed that
  # omits it.
  updater:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect the signatures and the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/updater"
          gh release download "$TAG" --pattern '*.sig' --dir "$RUNNER_TEMP/updater"
          gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/notes.md"

      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node app/scripts/updater-json.mjs \
            --dir "$RUNNER_TEMP/updater" \
            --tag "$TAG" \
            --repo "$REPO" \
            --notes "$RUNNER_TEMP/notes.md" \
            --out "$RUNNER_TEMP/latest.json"

      - name: Attach it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
