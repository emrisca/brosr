# A tag cuts a release. Each platform builds, signs its updater bundle and
# attaches latest.json, so an installed app can offer the next version.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install the frontend
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Brosr v__VERSION__
          releaseBody: |
            Pick the installer for your platform. macOS uses the `.dmg`, Windows
            uses the `.msi` or the `.exe` setup.

            ## First launch on macOS

            This build carries an ad hoc signature and no notarisation, so macOS
            asks once. Move Brosr to Applications, try to open it, then allow it
            in System Settings, Privacy and Security, Open Anyway.

            ## First launch on Windows

            SmartScreen asks once. Choose More info, then Run anyway.

            ## Updates

            An installed app reads this release's `latest.json` on launch and
            again every six hours. Install downloads in place and restarts the
            app. The app checks each update against a signing key that ships
            inside it, and refuses a release signed with another key.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
