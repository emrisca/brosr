# The tree ships no style linter, so the gate parses every JavaScript module
# with the Node parser. A syntax error then fails in a minute instead of after
# a forty minute browser job.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: parse every module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Parse the JavaScript
        run: |
          set -e
          find core host bridge scripts zen spike relay \
            -type f \( -name '*.mjs' -o -name '*.js' \) \
            -not -path '*/node_modules/*' \
            -not -path '*/.run/*' \
            -not -path '*/.runtime/*' | sort | while read -r file; do
            node --check "$file"
          done
