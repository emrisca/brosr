<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brosr room</title>
    <link rel="stylesheet" href="room.css" />
  </head>
  <body>
    <header class="room-header">
      <div class="room-title">
        <span class="dot" id="dot" data-state="idle" aria-hidden="true"></span>

        <h1 id="room">Room</h1>
      </div>

      <div class="room-meta">
        <span class="count" id="count" aria-label="Peers in this room"></span>

        <span class="role" id="role"></span>

        <span class="seal" id="seal" hidden></span>
      </div>

      <button
        class="icon-button"
        id="menu-button"
        type="button"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="menu"
        aria-label="Room menu"
        title="Room menu"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="3.5" r="1.4" />
          <circle cx="8" cy="8" r="1.4" />
          <circle cx="8" cy="12.5" r="1.4" />
        </svg>
      </button>

      <div class="menu" id="menu" role="menu" aria-label="Room menu" hidden>
        <button id="copy" class="menu-item" type="button" role="menuitem">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" />
            <path d="M10.5 5.5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5h2" />
          </svg>

          <span>Copy join link</span>
        </button>

        <button id="refresh" class="menu-item" type="button" role="menuitem">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89" />
            <path d="M13.5 2.5v3.1h-3.1" />
          </svg>

          <span>Refresh room</span>
        </button>

        <div class="menu-sep" role="separator"></div>

        <button id="hide" class="menu-item" type="button" role="menuitem">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="2" y="3" width="12" height="10" rx="1.5" />
            <path d="M6.5 3v10" />
            <path d="M12 8H8.5" />
            <path d="M10 6.5 8.5 8l1.5 1.5" />
          </svg>

          <span>Close panel</span>
        </button>

        <div class="menu-sep" role="separator"></div>

        <button id="leave" class="menu-item menu-danger" type="button" role="menuitem">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M6.5 3H4.5A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13h2" />
            <path d="M9.5 5.5 12 8l-2.5 2.5" />
            <path d="M12 8H6.5" />
          </svg>

          <span>Leave room</span>
        </button>
      </div>
    </header>

    <p class="status" id="status" role="status" aria-live="polite">Checking this tab.</p>

    <section class="invite" id="invite-box" hidden>
      <label for="invite">Join link</label>

      <div class="invite-row">
        <input id="invite" type="text" readonly />

        <button class="invite-copy" id="invite-copy" type="button">Copy</button>
      </div>
    </section>

    <p class="notice" id="notice" role="status" aria-live="polite"></p>

    <section class="panel-sites" id="panel-sites" hidden>
      <p class="section-title">Dropped here</p>

      <ul class="site-list" id="panel-sites-list"></ul>
    </section>

    <section class="peers-section" aria-labelledby="peers-label">
      <p class="section-title" id="peers-label">In this room</p>

      <ul id="peers"></ul>
    </section>

    <section class="watch" id="watch" aria-labelledby="watch-label">
      <div class="watch-head">
        <p class="section-title" id="watch-label">Watch together</p>

        <span class="watch-state" id="watch-state">No media</span>
      </div>

      <div class="watch-row">
        <p class="watch-copy" id="watch-copy">The host has not started a film.</p>

        <button
          class="watch-button"
          id="watch-toggle"
          type="button"
          disabled
          aria-describedby="watch-copy"
          title="No film in this room yet"
        >
          Open the film
        </button>
      </div>

      <ul class="watch-viewers" id="watch-viewers"></ul>
    </section>

    <section class="control" id="control" hidden>
      <p class="section-title">Control</p>

      <ul class="history" id="history"></ul>
    </section>

    <section class="tabs" id="tabs-section" aria-labelledby="tabs-label">
      <div class="tabs-head">
        <p class="section-title" id="tabs-label">Sync tabs</p>

        <label class="tabs-auto" for="tabs-auto">
          <input type="checkbox" id="tabs-auto" />

          <span>Share new tabs</span>
        </label>
      </div>

      <p class="tabs-note" id="tabs-note" hidden></p>

      <ul class="tab-list" id="tabs-list"></ul>
    </section>

    <footer>
      <span class="stat" id="playback">-</span>

      <span class="stat" id="relay">-</span>

      <span class="stat" id="latency">-</span>
    </footer>

    <script src="room.js"></script>
  </body>
</html>
